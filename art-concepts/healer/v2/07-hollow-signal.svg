<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- HOLLOW SIGNAL // a dying vector display. red phosphor #ff3b2a, burn-in #5a0f0a, hot #ffc2b8 on black #070202. Hunched mesh, broken lines, ghost offsets. -->
  <defs>
    <filter id="phos" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="134,30 162,46 172,80 178,110 212,244 46,244 80,118 88,86 98,70 112,44" fill="#070202" opacity="0.92"/>
  <!-- burn-in ghost, offset -->
  <g fill="none" stroke="#5a0f0a" stroke-width="1.4" transform="translate(4 -2)">
    <polygon points="134,30 162,46 172,80 178,110 212,244 46,244 80,118 88,86 98,70 112,44"/>
    <path d="M52 10 L64 31 L52 52 L40 31 Z"/>
  </g>
  <g fill="none" stroke="#ff3b2a" stroke-width="1.6" stroke-linejoin="bevel" filter="url(#phos)">
    <!-- outline, with dropouts -->
    <polygon points="134,30 162,46 172,80 178,110 212,244 46,244 80,118 88,86 98,70 112,44" stroke-dasharray="120 5 60 3 200 8 140 4"/>
    <!-- mesh -->
    <path d="M112 44 L122 62 L134 30 M122 62 L146 60 L162 46 M98 70 L122 62"/>
    <path d="M88 86 L114 104 L134 112 L150 104 L172 80"/>
    <path d="M114 104 L104 172 L134 112 L158 172 L150 104" stroke-dasharray="40 4 20 3"/>
    <path d="M80 118 L104 172 M178 110 L158 172 M66 172 H192" stroke-dasharray="14 3 30 6"/>
    <path d="M104 172 L80 244 M104 172 L130 244 L158 172 M158 172 L182 244" opacity="0.5" stroke-dasharray="6 4"/>
    <!-- face hex, slumped -->
    <polygon points="104,66 128,60 136,74 130,92 112,96 102,82"/>
    <!-- staff, kinked -->
    <path d="M52 52 L54 120 L50 128 L52 244"/>
    <polygon points="52,10 64,31 52,52 40,31"/>
    <path d="M52 14 L56 28 L48 34 L52 48" opacity="0.6"/>
    <!-- arm -->
    <path d="M90 114 L60 124 L62 136 L94 128"/>
    <!-- failing health glyph -->
    <path d="M126 130 h8 v6 h6 v8 h-6 v6 h-8 v-6 h-6 v-8 h6 Z" stroke-dasharray="10 4 6 6"/>
  </g>
  <!-- one eye lit, one burnt out -->
  <rect x="110" y="76" width="6" height="3" fill="#ffc2b8" filter="url(#phos)"/>
  <rect x="122" y="74" width="6" height="3" fill="#5a0f0a"/>
  <!-- glitch slice -->
  <rect x="62" y="196" width="60" height="2" fill="#ff3b2a" opacity="0.5" filter="url(#phos)"/>
  <rect x="150" y="140" width="40" height="1.5" fill="#ff3b2a" opacity="0.35"/>
  <!-- vertices -->
  <g fill="#ffc2b8" filter="url(#phos)">
    <rect x="132.5" y="28.5" width="3" height="3"/><rect x="110.5" y="42.5" width="3" height="3"/><rect x="160.5" y="44.5" width="3" height="3"/>
    <rect x="86.5" y="84.5" width="3" height="3"/><rect x="170.5" y="78.5" width="3" height="3"/><rect x="132.5" y="110.5" width="3" height="3"/>
    <rect x="102.5" y="170.5" width="3" height="3"/><rect x="50.5" y="8.5" width="3" height="3"/>
  </g>
</svg>
