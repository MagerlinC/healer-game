<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- GILDED ICON // night #0f1730, gold #d8b25a (2px lines), oxblood #5e1420, gilt-skin #e7cf93. Frontal, symmetrical, serene. -->
  <defs>
    <path id="star" d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z"/>
  </defs>
  <!-- halo: solid disc, ray ring, thin inner ring -->
  <circle cx="128" cy="62" r="50" fill="#d8b25a" opacity="0.18"/>
  <circle cx="128" cy="62" r="46" fill="none" stroke="#d8b25a" stroke-width="7" stroke-dasharray="2 5"/>
  <circle cx="128" cy="62" r="38" fill="none" stroke="#d8b25a" stroke-width="1.5"/>
  <!-- staff -->
  <path d="M52 50 V244" stroke="#d8b25a" stroke-width="4"/>
  <path d="M52 6 L64 28 L52 50 L40 28 Z" fill="#0f1730" stroke="#d8b25a" stroke-width="2"/>
  <path d="M52 16 V40 M44 28 H60" stroke="#d8b25a" stroke-width="2"/>
  <!-- mantle -->
  <path d="M128 18 C152 20 168 42 170 68 L176 104 C190 150 200 200 210 240 L46 240 C56 200 66 150 80 104 L86 68 C88 42 104 20 128 18 Z" fill="#0f1730" stroke="#d8b25a" stroke-width="2.5"/>
  <!-- mantle border trim -->
  <path d="M128 26 C146 28 160 46 162 68 L168 104 C180 150 190 200 198 234" fill="none" stroke="#d8b25a" stroke-width="1" stroke-dasharray="1 3"/>
  <path d="M128 26 C110 28 96 46 94 68 L88 104 C76 150 66 200 58 234" fill="none" stroke="#d8b25a" stroke-width="1" stroke-dasharray="1 3"/>
  <!-- stars on mantle -->
  <g fill="#d8b25a">
    <use href="#star" x="96" y="150"/><use href="#star" x="80" y="200"/><use href="#star" x="162" y="160"/>
    <use href="#star" x="176" y="212"/><use href="#star" x="102" y="112" transform="scale(1)"/>
  </g>
  <!-- inner robe -->
  <path d="M110 100 L146 100 L158 240 L98 240 Z" fill="#5e1420" stroke="#d8b25a" stroke-width="2"/>
  <path d="M128 140 V236 M118 150 L112 236 M138 150 L144 236" stroke="#d8b25a" stroke-width="1"/>
  <!-- folded hands holding a vial -->
  <path d="M110 112 C116 104 140 104 146 112 L142 128 C134 134 122 134 114 128 Z" fill="#e7cf93" stroke="#d8b25a" stroke-width="2"/>
  <path d="M124 92 h8 v6 c6 2 8 8 8 12 c0 6 -6 10 -12 10 c-6 0 -12 -4 -12 -10 c0 -4 2 -10 8 -12 Z" fill="#0f1730" stroke="#d8b25a" stroke-width="2"/>
  <path d="M120 112 c4 4 12 4 16 0" stroke="#e05a6a" stroke-width="3" fill="none"/>
  <!-- face -->
  <ellipse cx="128" cy="64" rx="15" ry="19" fill="#e7cf93" stroke="#d8b25a" stroke-width="2"/>
  <path d="M117 64 q4 3 8 0 M131 64 q4 3 8 0" stroke="#0f1730" stroke-width="1.8" fill="none"/>
  <path d="M128 50 v6 M125 53 h6" stroke="#5e1420" stroke-width="1.8"/>
  <path d="M125 75 h6" stroke="#0f1730" stroke-width="1.5"/>
  <!-- hood edge over face -->
  <path d="M108 70 C108 44 148 44 148 70" fill="none" stroke="#d8b25a" stroke-width="2.5"/>
</svg>
